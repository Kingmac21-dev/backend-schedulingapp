
name: Backend CI

on:
  push:
    branches: [deployment-for-backend]
  pull_request:
    branches: [deployment-for-backend]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Deploy backend to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."             # all your backend files in the repo root
          target: "/home/ubuntu/deployed-backend"

      - name: Start backend app with PM2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/deployed-backend
            npm install                # install dependencies on server
            pm2 restart backend-app || pm2 start index.js --name backend-app
            
            pm2 startup                # sets pm2 to auto-start on reboot

            






