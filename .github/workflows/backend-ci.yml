name: Backend CI

on:
  push:
    branches: [deployment-for-backend]
  pull_request:
    branches: [deployment-for-backend]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Deploy backend to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/ubuntu/deployed-backend"

      - name: Start backend app without PM2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/deployed-backend

            # Kill existing node process (if any)
            pkill -f "node index.js" || echo "No existing node process to kill"

            # Start app in background detached with output logged
            nohup node index.js > app.log 2>&1 &





