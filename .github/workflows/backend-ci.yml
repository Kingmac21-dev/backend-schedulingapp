      - name: Deploy backend to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/ubuntu/deployed-backend"

      - name: Start backend app without PM2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/deployed-backend
            
            # Kill existing node processes running this app (optional)
            pkill -f "node index.js" || echo "No node process to kill"
            
            # Start app in background, redirect output, detach from terminal
            nohup node index.js > app.log 2>&1 &




