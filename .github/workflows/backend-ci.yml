name: Backend CI/CD

on:
  push:
    branches: [deployment-for-backend]
  pull_request:
    branches: [deployment-for-backend]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Upload backend to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."  # adjust if your backend is in a subfolder
          target: "/home/ubuntu/deployed-backend"

      - name: Setup and start backend on EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Install Node.js and npm if missing
            if ! command -v node > /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Install pm2 globally if not already installed
            if ! command -v pm2 > /dev/null; then
              sudo npm install -g pm2
            fi

            # Go to backend folder
            cd /home/ubuntu/deployed-backend

            # Install app dependencies
            npm install

            # Start or restart with pm2
            if pm2 list | grep -q 'backend-app'; then
              pm2 restart backend-app
            else
              pm2 start index.js --name backend-app
            fi

            # Save pm2 process
            pm2 save

          

            






